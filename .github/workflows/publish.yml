name: Publish package to npm

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used to prepare and publish.
        required: false
        default: "26"
        type: string
      tested-sha:
        description: Commit tested by the caller's CI. Defaults to the calling workflow's commit.
        required: false
        default: ""
        type: string
      package-manager:
        description: Package manager used to install dependencies and run package scripts (npm, yarn, or pnpm).
        required: false
        default: pnpm
        type: string
      working-directory:
        description: Directory containing package.json.
        required: false
        default: "."
        type: string
      registry-url:
        description: npm registry URL.
        required: false
        default: https://registry.npmjs.org
        type: string
      npm-access:
        description: npm package access passed to `npm publish --access`.
        required: false
        default: public
        type: string
      create-release:
        description: Create a GitHub release named after the package version.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.package.outputs.version }}
      published_sha: ${{ steps.revision.outputs.tested_sha }}
    steps:
      - name: Checkout the CI-tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.tested-sha || github.sha }}
          # The read-only checkout credential permits fetching private repos too.
          persist-credentials: true

      - name: Verify the tested revision is still main
        id: revision
        env:
          TESTED_SHA: ${{ inputs.tested-sha || github.sha }}
          CALLER_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || [ "$TESTED_SHA" != "$CALLER_SHA" ]; then
            echo "The tested commit must match the calling workflow's commit" >&2
            exit 1
          fi

          git fetch --no-tags origin refs/heads/main
          if [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ] || [ "$(git rev-parse FETCH_HEAD)" != "$TESTED_SHA" ]; then
            echo "Refusing to publish a revision that is no longer the tip of main" >&2
            exit 1
          fi

          echo "tested_sha=$TESTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: ${{ inputs.registry-url }}
          package-manager-cache: false

      - name: Read package version and lifecycle scripts
        id: package
        working-directory: ${{ inputs.working-directory }}
        run: |
          node -e '
            const pkg = require("./package.json");
            const scripts = pkg.scripts ?? {};
            const legacy = !scripts.prepublishOnly && scripts.prepublish ? "prepublish" : "";
            console.log("version=" + pkg.version);
            console.log("legacy_script=" + legacy);
          ' >> "$GITHUB_OUTPUT"

      - name: Validate package manager
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            npm|yarn|pnpm) ;;
            *)
              echo "package-manager must be one of: npm, yarn, pnpm" >&2
              exit 1
              ;;
          esac

      - name: Install Corepack for pnpm and Yarn
        if: inputs.package-manager != 'npm'
        run: |
          npm install --global corepack@0.36.0
          corepack enable

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            npm) npm ci ;;
            yarn) yarn install --immutable ;;
            pnpm) pnpm install --frozen-lockfile ;;
          esac

      # npm publish invokes prepublishOnly itself. Preserve older packages that
      # use prepublish, without executing prepublishOnly twice.
      - name: Run legacy prepublish
        if: steps.package.outputs.legacy_script != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          "$PACKAGE_MANAGER" run prepublish

      - name: Ensure recent npm for trusted publishing
        run: npm install --global npm@11.21.0

      - name: Reconfirm the published revision
        env:
          TESTED_SHA: ${{ steps.revision.outputs.tested_sha }}
        run: |
          git fetch --no-tags origin refs/heads/main
          if [ "$(git rev-parse HEAD)" != "$TESTED_SHA" ] || [ "$(git rev-parse FETCH_HEAD)" != "$TESTED_SHA" ]; then
            echo "Refusing to publish a revision that is no longer the tip of main" >&2
            exit 1
          fi

      - name: Publish to npm with provenance
        working-directory: ${{ inputs.working-directory }}
        env:
          NPM_ACCESS: ${{ inputs.npm-access }}
          REGISTRY_URL: ${{ inputs.registry-url }}
        run: npm publish --provenance --access "$NPM_ACCESS" --registry "$REGISTRY_URL"

  release:
    needs: publish
    if: inputs.create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.publish.outputs.version }}
          name: v${{ needs.publish.outputs.version }}
          target_commitish: ${{ needs.publish.outputs.published_sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
